<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Core Interface</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hud-container">
        <!-- Background Grid & Glow -->
        <div class="grid-overlay"></div>
        <div class="ambient-glow"></div>

        <!-- Top Left Status -->
        <div class="hud-panel top-left">
            <div class="sys-title">SYSTEM.STATUS</div>
            <div class="sys-value">ONLINE</div>
            <div class="sys-title">AI.CORE</div>
            <div class="sys-value">GEMINI FLASH LITE LATTEST</div>
        </div>

        <!-- Top Right Diagnostics -->
        <div class="hud-panel top-right">
            <div class="sys-title">JARVIS.STATUS</div>
            <div class="sys-value" id="uplink-status">ONLINE</div>
            <div class="sys-title">DATETIME</div>
            <div class="sys-value" id="datetime-display">00:00:00</div>
        </div>

        <!-- Center Main Orb & Audio Waveform -->
        <div class="center-core">
            <div class="orb-ring ring-1"></div>
            <div class="orb-ring ring-2"></div>
            <div class="orb-ring ring-3"></div>
            <div class="core-orb" id="jarvis-orb">
                <div class="orb-core-inner"></div>
            </div>
            <div class="status-text" id="status-text">AWAITING INPUT</div>
        </div>

        <!-- File Preview Container -->
        <div id="file-preview-container" class="hud-panel" style="display: none; position: absolute; bottom: 400px; left: 50%; transform: translateX(-50%); align-items: center; gap: 20px; min-width: 300px; z-index: 15; padding: 20px; border-radius: 8px;">
            <img id="file-preview-img" src="" alt="Preview" style="max-height: 150px; max-width: 250px; border-radius: 6px; display: none; box-shadow: 0 0 10px rgba(0,210,255,0.3);">
            <div id="file-preview-name" class="sys-value" style="font-size: 1.3rem; text-shadow: 0 0 8px var(--core-blue);"></div>
            <button id="file-preview-close" class="hud-button alt-button" style="padding: 8px 15px; font-size: 1rem; margin-left: auto;">X</button>
        </div>

        <!-- Bottom Transcript Panel -->
        <div class="hud-panel bottom-center">
            <div class="sys-title">RUNTIME.TRANSCRIPT</div>
            <div class="transcript-box" id="transcript-box">
                <div class="message system">Initialization complete. All systems operational.</div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls" style="flex-direction: column; align-items: center; gap: 10px;">
            <div class="input-group">
                <button id="mode-toggle-btn" class="hud-button" style="border-color: #00ffcc; color: #00ffcc; background: rgba(0, 255, 204, 0.1);">AUDIO MODE</button>
                <div id="text-controls" style="display: none; align-items: center; gap: 10px;">
                    <button id="upload-btn" class="hud-button" style="padding: 10px 15px; font-weight: bold; font-size: 1.2rem;" title="Upload File">+</button>
                    <input type="file" id="file-upload" accept="image/*,.pdf,.txt" style="display:none">
                    <input type="text" id="chat-input" class="hud-input" placeholder="TYPE COMMAND OR QUERY..."
                        autocomplete="off">
                    <button id="send-btn" class="hud-button">SEND</button>
                </div>
                <div id="audio-controls" style="display: flex; align-items: center; gap: 10px;">
                    <button id="mic-btn" class="hud-button alt-button">MIC</button>
                </div>
                <button id="stop-btn" class="hud-button alt-button" style="background: rgba(255, 50, 50, 0.2); border-color: #ff3333; color: #ff3333;">STOP</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
